# Milestone 3: DB configuration read by InventoryRepository at startup.
# Replaces data/inventory.csv (Milestone 2) as the durable source of truth
# for stock levels. Values here override the defaults baked into
# META-INF/persistence.xml.
db.url=jdbc:h2:./data/pricingdb;AUTO_SERVER=TRUE
db.driver=org.h2.Driver
db.user=sa
db.password=

# Milestone 3: Spring Boot REST API layer
spring.application.name=pricing-engine
server.port=8080

# Milestone 3: pricing inputs read by ConfigurablePricingInputsProvider.
# "default-*" applies to any SKU with no entry below; per-SKU overrides only
# need to set the fields that differ from the defaults.
pricing.default-cost=15.00
pricing.default-current-price=24.99
pricing.default-competitor-price=22.50
pricing.default-days-in-inventory=10

# Per-SKU pricing inputs, so different SKUs don't all price identically off
# the shared defaults above. Any SKU not listed here (e.g. a brand-new SKU
# with no override yet) still falls back to the default-* values.
pricing.skus[SKU-1001].cost=18.00
pricing.skus[SKU-1001].competitor-price=26.50
pricing.skus[SKU-1001].current-price=27.99
# Brand-positioning guardrails for SKU-1001: never price it below $21.50 or
# above $25.00, regardless of what cost, competitor price, or demand trend
# would otherwise produce.
pricing.skus[SKU-1001].min-price=21.50
pricing.skus[SKU-1001].max-price=25.00

pricing.skus[SKU-2002].cost=8.00
pricing.skus[SKU-2002].competitor-price=13.50
pricing.skus[SKU-2002].current-price=14.99

# Seeds the mock SKU-DEMO-1..5 dataset (see DemoDataSeeder) once at startup,
# so a presentation immediately has a rich, non-overlapping Price History
# chart instead of every untouched SKU sharing the defaults above and
# landing on the same price. Left unset (defaults to false) on the test
# classpath's application.properties, which fully replaces this file there.
demo.seed-data=true

# Milestone 3: CORS origins allowed to call /api/**, read by WebConfig.
# "*" is permissive on purpose -- this is a course project with no auth/cookies,
# and the frontend origin (a local dev server, a generated-app preview URL) is
# not fixed. Comma-separated list, e.g.:
# cors.allowed-origins=http://localhost:3000,https://your-app.emergent.host
cors.allowed-origins=*
