# Test-only override: points InventoryRepository at an isolated in-memory H2
# database so `mvn test` never reads or writes the real ./data/pricingdb file
# used by `mvn spring-boot:run` / the console demo.
db.url=jdbc:h2:mem:pricing-engine-test;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.user=sa
db.password=

spring.application.name=pricing-engine
server.port=8080

# Mirrors src/main/resources/application.properties so the integration test
# exercises the same guardrail-clamped behavior as the real app. (This file
# fully replaces the main one on the test classpath, it isn't merged with it.)
pricing.default-cost=15.00
pricing.default-current-price=24.99
pricing.default-competitor-price=22.50
pricing.default-days-in-inventory=10
pricing.skus.SKU-1001.min-price=21.50
pricing.skus.SKU-1001.max-price=25.00
