# Test-only override: points InventoryRepository at an isolated in-memory H2
# database so `mvn test` never reads or writes the real ./data/pricingdb file
# used by `mvn spring-boot:run` / the console demo.
db.url=jdbc:h2:mem:pricing-engine-test;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.user=sa
db.password=

spring.application.name=pricing-engine
server.port=8080
